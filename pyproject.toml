[project]
name = "djcodebot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]
