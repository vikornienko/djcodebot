{% extends 'base.html' %}

{% block content %}
  {% if code %}
  <pre>
    <code class="line-numbers language-{{lang}}">{{code}}</code>
  </pre>

  <br /><br />
  <form action="#" method="post">
    {% csrf_token %}

    <div class="mb-3">
      <textarea class="form-control" name="code" rows="3" placeholder="Have SI fix my code"></textarea>
    </div>
    <br />
    <select class="form-select" name="lang">
      <option selected>Select Programming Languge</option>
      {% for lang in lang_list %}
        <option value="{{ lang }}">{{ lang }}</option>
      {% endfor %}
    </select>
    <br /><br /><br />
    <button type="submit" class="btn btn-secondary">Submit</button>
  </form>
  {% else %}

  <pre>
    <code class="line-numbers language-python">
      print("Hello, World!")
    </code>
  </pre>

  <br /><br />
  <form action="#" method="post">
    {% csrf_token %}

    <div class="mb-3">
      <textarea class="form-control" name="code" rows="3" placeholder="Have SI fix my code"></textarea>
    </div>
    <br />
    <select class="form-select" name="lang">
      <option selected>Select Programming Languge</option>
      {% for lang in lang_list %}
        <option value="{{ lang }}">{{ lang }}</option>
      {% endfor %}
    </select>
    <br /><br /><br />
    <button type="submit" class="btn btn-secondary">Submit</button>
  </form>
  {% endif %}
{% endblock %}
