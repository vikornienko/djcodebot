{% extends 'base.html' %}

{% block content %}
  <h1>Hello, world!</h1>

  <pre>
    <code class="line-numbers language-python"></code>
  </pre>

  <br /><br />
  <form action="#" method="post">
    {% csrf_token %}
    
    <div class="mb-3">
      
      <textarea class="form-control" name="code" rows="3" placeholder="Have SI fix my code"></textarea>
    </div>
    <br>
    <select class="form-select" aria-label="Default select example">
  <option selected>Select Programming Languge</option>
  {% for lang in lang_list  %}
  <option value="{{ lang }}">{{ lang }}</option>
  {% endfor %}
</select>
<br><br><br>
    <button type="submit" class="btn btn-secondary">Submit</button>
  </form>
{% endblock %}
